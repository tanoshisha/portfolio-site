# 管理画面（/admin）の設定。保存すると GitHub の main に直接コミットされ、
# Vercel のビルドで軽量版の画像（scripts/make-variants.js）も作られて約2分で公開される。
backend:
  name: github
  repo: tanoshisha/portfolio-site
  branch: main
  commit_messages:
    update: "CMS: 写真一覧を更新"
    uploadMedia: "CMS: 画像 {{path}} を追加"
    deleteMedia: "CMS: 画像 {{path}} を削除"

site_url: https://hayatonaoe.com
display_url: https://hayatonaoe.com
logo_url: /icon.png

media_folder: public/images/gallery
public_folder: /images/gallery

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        # スマホの大きな写真も、アップロード時に長辺2200pxのWebPへ自動で軽量化
        raster_image:
          format: webp
          quality: 85
          width: 2200
          height: 2200

collections:
  - name: photos
    label: 写真
    icon: photo_library
    description: サイトに載せる写真。並び順＝サイトでの表示順（ドラッグで入れ替え）。保存すると約2分で公開されます。
    editor: { preview: false }
    files:
      - name: photos
        label: 写真の一覧
        file: src/data/photos.json
        format: json
        description: 並び順 = サイトでの表示順。ドラッグで入れ替えできます。
        fields:
          - name: heroSlides
            label: 🎞 トップのスライド写真
            hint: サイトを開いて最初に大きく流れる写真（3〜8枚がおすすめ）
            widget: list
            min: 1
            max: 10
            collapsed: true
            add_to_top: true
            summary: "{{fields.src}}"
            fields:
              - { name: src, label: 写真, widget: image }
              - name: position
                label: 切り取り位置
                widget: select
                required: false
                default: ""
                hint: 縦写真で顔が切れるときは「上寄り」
                options:
                  - { label: 中央, value: "" }
                  - { label: 上寄り, value: "center 25%" }
                  - { label: 下寄り, value: "center 75%" }
          - name: works
            label: 💼 Works（撮影実績）
            hint: お仕事の写真。上ほど先に表示されます。
            widget: list
            collapsed: true
            add_to_top: true
            summary: "{{fields.title | default('（タイトルなし）')}}　{{fields.category}}"
            fields:
              - { name: src, label: 写真, widget: image }
              - { name: title, label: タイトル, widget: string, required: false, hint: "写真の下に出る名前。検索や読み上げの説明にも使われます（例：カフェの窓辺のポートレート）" }
              - name: category
                label: カテゴリ
                widget: select
                default: portrait
                options:
                  - { label: Portrait（人物）, value: portrait }
                  - { label: Shop & Bar（お店）, value: shop }
          - name: personal
            label: 🖼 Gallery（個人作品）
            hint: 街のスナップなど個人の作品。上ほど先に表示されます。
            widget: list
            collapsed: true
            add_to_top: true
            summary: "{{fields.title | default('（タイトルなし）')}}"
            fields:
              - { name: src, label: 写真, widget: image }
              - { name: title, label: タイトル, widget: string, required: false, hint: "写っているものを1文で（検索や読み上げの説明に使われます）。例：夕暮れの街を自転車で走る人のシルエット" }
